<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Planificador 3D del deck de la piscina: prueba reposeras, barra y muebles con medidas reales.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Croquis del Deck">
<meta property="og:description" content="Planificador 3D para probar muebles en el deck de la piscina.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1311'/%3E%3Crect x='6' y='9' width='20' height='8' rx='2' fill='%234fb9d0'/%3E%3Cpath d='M5 22c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2' stroke='%2357d3c4' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Croquis del Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#0f1311; --glass:rgba(16,20,18,.84); --glass-line:rgba(255,255,255,.14);
    --ink:#f3f0e7; --ink-2:#a7ae9f; --accent:#57d3c4; --accent-ink:#07211e; --warn:#ff9070;
  }
  html,body{height:100%; overflow:hidden}
  body{background:var(--paper); color:var(--ink); font-family:"Chivo","Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased}
  #stage{position:fixed; inset:0}
  #view{display:block; width:100%; height:100%; touch-action:none; outline:none}
  .ui{position:fixed; z-index:5}
  .glass{background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glass-line); border-radius:12px; box-shadow:0 12px 36px rgba(0,0,0,.45)}
  button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
  .chip{background:rgba(255,255,255,.07); border:1px solid var(--glass-line); border-radius:999px; padding:6px 13px; font-size:12.5px; white-space:nowrap; transition:background .14s,border-color .14s}
  .chip:hover{background:rgba(255,255,255,.16)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #top{top:calc(12px + env(safe-area-inset-top,0px)); left:12px; right:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:9px 12px}
  #top h1{font-size:15px; font-weight:800; letter-spacing:-.01em; margin:0 8px 0 2px}
  #top .presets{display:flex; gap:6px; flex-wrap:wrap}
  .grow{flex:1 1 auto}
  #side{top:calc(74px + env(safe-area-inset-top,0px)); right:12px; width:252px; max-height:calc(100% - 190px); overflow:auto; padding:12px; display:flex; flex-direction:column; gap:14px}
  #side h2{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-2); margin:0 0 8px; font-weight:600}
  .catalog{display:grid; grid-template-columns:1fr 1fr; gap:5px}
  .cat{text-align:left; border:1px solid var(--glass-line); border-radius:7px; padding:6px 7px; display:flex; flex-direction:column; gap:1px; background:rgba(255,255,255,.04)}
  .cat:hover{background:rgba(255,255,255,.14); border-color:var(--accent)}
  .cat b{font-size:12px; font-weight:600}
  .cat span{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .dims{display:grid; grid-template-columns:1fr 1fr; gap:7px 9px}
  .field{display:flex; flex-direction:column; gap:2px}
  .field label{font-size:10.5px; color:var(--ink-2)}
  .field input{font-family:"IBM Plex Mono",monospace; font-size:12.5px; width:100%; box-sizing:border-box; background:rgba(0,0,0,.35); color:var(--ink); border:1px solid var(--glass-line); border-radius:5px; padding:5px 6px}
  .slider{display:flex; flex-direction:column; gap:5px}
  .slider .row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-2)}
  .slider .row b{color:var(--ink); font-family:"IBM Plex Mono",monospace; font-weight:500}
  input[type=range]{width:100%; accent-color:var(--accent)}
  .note{font-size:11px; color:var(--ink-2); line-height:1.35}
  #bottom{left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px 14px; align-items:center; flex-wrap:wrap; padding:9px 12px}
  #readout{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  #readout b{color:var(--ink); font-family:"Chivo",sans-serif; font-weight:600}
  #flag{color:var(--warn); font-size:12px; font-weight:600}
  .acts{display:flex; gap:6px; flex-wrap:wrap}
  #photo{left:12px; bottom:calc(66px + env(safe-area-inset-bottom,0px)); width:250px; padding:6px; display:none}
  #photo.show{display:block}
  #photo img{display:block; width:100%; border-radius:7px}
  #photo p{margin:5px 3px 1px; font-size:10.5px; color:var(--ink-2)}
  #boot{position:fixed; inset:0; display:grid; place-items:center; background:var(--paper); z-index:20; text-align:center; padding:24px}
  #boot p{color:var(--ink-2); font-size:13px; max-width:38ch; margin:0}
  #boot .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); margin:0 auto 12px; animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.9); opacity:.35}}
  @media (prefers-reduced-motion:reduce){ #boot .dot{animation:none} }
  @media (max-width:880px){
    #side{top:auto; bottom:calc(66px + env(safe-area-inset-bottom,0px)); left:12px; right:12px; width:auto; max-height:36vh}
    .catalog{grid-template-columns:repeat(3,minmax(0,1fr))}
    #photo{display:none !important}
  }

  /* base autónoma (en el visor de Claude esto lo ponía la plataforma) */
  html,body{margin:0; -webkit-text-size-adjust:100%}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="stage"><canvas id="view" aria-label="Vista 3D del deck y la piscina"></canvas></div>
<div id="boot"><div><div class="dot"></div><p id="bootMsg">Cargando el motor 3D…</p></div></div>

<div class="ui glass" id="top">
  <h1>Croquis del Deck</h1>
  <div class="presets" id="presets"></div>
  <div class="grow"></div>
  <button class="chip" id="viewPhoto">Vista de la foto</button>
  <button class="chip" id="viewAir">Aérea</button>
  <button class="chip" id="btnZonas">Zonas</button>
  <button class="chip" id="btnRef">Foto real</button>
  <button class="chip" id="btnPanel">Panel</button>
</div>

<div class="ui glass" id="side">
  <div><h2>Agregar</h2><div class="catalog" id="catalog"></div></div>
  <div>
    <h2>Medidas del deck (m)</h2>
    <div class="dims">
      <div class="field"><label for="deckW">Deck largo</label><input id="deckW" type="number" step="0.1" min="4" max="40"></div>
      <div class="field"><label for="deckH">Deck ancho</label><input id="deckH" type="number" step="0.1" min="3" max="30"></div>
      <div class="field"><label for="poolW">Piscina largo</label><input id="poolW" type="number" step="0.1" min="1" max="35"></div>
      <div class="field"><label for="poolH">Piscina ancho</label><input id="poolH" type="number" step="0.1" min="1" max="25"></div>
      <div class="field"><label for="poolX">Desde izquierda</label><input id="poolX" type="number" step="0.1" min="0" max="35"></div>
      <div class="field"><label for="poolY">Desde el muro</label><input id="poolY" type="number" step="0.1" min="0" max="25"></div>
    </div>
    <p class="note" id="dimNote">Medidas estimadas desde tu foto (±7%). Corrígelas si tienes las reales.</p>
  </div>
  <div class="slider">
    <div class="row"><label for="hour">Hora del día</label><b id="hourVal">16:00</b></div>
    <input id="hour" type="range" min="7" max="20" step="0.25">
  </div>
  <div>
    <h2>Calidad</h2>
    <div style="display:flex; gap:6px; flex-wrap:wrap">
      <button class="chip" id="qHigh">Alta</button>
      <button class="chip" id="qFast">Rápida</button>
    </div>
    <p class="note" id="qNote"></p>
  </div>
</div>

<script>
(function(){
  var CORE = [
    "https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js",
    "https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js"
  ];
  var MATS = [
    "https://cdn.jsdelivr.net/npm/babylonjs-materials@7.0.0/babylonjs.materials.min.js",
    "https://cdn.jsdelivr.net/npm/babylonjs-materials@6.49.0/babylonjs.materials.min.js"
  ];
  var msg = function(t){ var e=document.getElementById("bootMsg"); if(e) e.textContent=t; };
  function chain(list, i, ok, fail){
    if(i >= list.length){ fail(); return; }
    var s = document.createElement("script");
    s.src = list[i];
    s.onload = ok;
    s.onerror = function(){ chain(list, i+1, ok, fail); };
    document.head.appendChild(s);
  }
  function go(){
    chain(CORE, 0, function(){
      if(!window.BABYLON){ msg("No se pudo cargar el motor 3D. Recarga la página."); return; }
      msg("Cargando materiales…");
      chain(MATS, 0, function(){ start(); }, function(){ start(); });
    }, function(){ msg("No se pudo cargar el motor 3D. Revisa la conexión y recarga."); });
  }
  if(document.readyState === "loading") window.addEventListener("DOMContentLoaded", go); else go();
})();

function start(){
"use strict";
var B = window.BABYLON;
try{

/* ===================== catálogo y estado ===================== */
var CATALOG = [
  {type:"reposera",   name:"Reposera",    w:1.98, d:0.70},
  {type:"daybed",     name:"Daybed",      w:2.00, d:1.60},
  {type:"sombrilla",  name:"Sombrilla",   w:2.70, d:2.70},
  {type:"sofa",       name:"Sofá",        w:2.10, d:0.88},
  {type:"sillon",     name:"Sillón",      w:0.90, d:0.88},
  {type:"mesacentro", name:"Mesa centro", w:1.10, d:0.60},
  {type:"barra",      name:"Barra",       w:1.80, d:0.62},
  {type:"piso",       name:"Piso barra",  w:0.40, d:0.40},
  {type:"mesacomer",  name:"Mesa comedor",w:1.80, d:0.90},
  {type:"silla",      name:"Silla",       w:0.50, d:0.55},
  {type:"parrilla",   name:"Parrilla",    w:1.20, d:0.65},
  {type:"macetero",   name:"Macetero",    w:0.60, d:0.60},
  {type:"ducha",      name:"Ducha",       w:0.40, d:0.40},
  {type:"toalla",     name:"Perchero",    w:0.50, d:0.50}
];
var byType = {}; CATALOG.forEach(function(c){ byType[c.type]=c; });

/* medidas obtenidas de la foto por fotogrametría */
var DEFAULT = {
  deck:{w:15.5, h:7.4},
  pool:{x:5.0, y:2.1, w:9.6, h:4.4},
  hour:16, quality:"alta", items:[], seq:1
};
var S = JSON.parse(JSON.stringify(DEFAULT));
var KEY = "croquis-deck-bjs-v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !d.deck || !d.pool || !Array.isArray(d.items)) return false;
    d.items = d.items.filter(function(i){ return byType[i.type]; });
    S = d; if(typeof S.hour !== "number") S.hour = 16;
    if(!S.seq) S.seq = 1; if(!S.quality) S.quality = "alta";
    return true;
  }catch(e){ return false; }
}


/* ============ zonas útiles: sólo se amuebla donde cabe algo con paso ============ */
var PASO = 0.45;                       /* paso libre mínimo, en metros */
var MIN_ZONA = 1.15;                   /* franja mínima para poner cualquier cosa */
function geom(){
  var d=S.deck, p=S.pool;
  return {
    oeste:{key:"oeste", x0:0, x1:p.x, z0:0, z1:d.h},
    este:{key:"este",  x0:p.x+p.w, x1:d.w, z0:0, z1:d.h},
    norte:{key:"norte", x0:p.x, x1:p.x+p.w, z0:0, z1:p.y},
    sur:{key:"sur",   x0:p.x, x1:p.x+p.w, z0:p.y+p.h, z1:d.h}
  };
}
function zw(z){ return z.x1-z.x0; }
function zd(z){ return z.z1-z.z0; }
function zoneUsable(z){ return zw(z) >= MIN_ZONA && zd(z) >= MIN_ZONA; }
function zoneCenter(z){ return {x:(z.x0+z.x1)/2, z:(z.z0+z.z1)/2}; }
function zonesByArea(){
  var g=geom(), out=[g.oeste,g.este,g.norte,g.sur].filter(zoneUsable);
  out.sort(function(a,b){ return zw(b)*zd(b) - zw(a)*zd(a); });
  return out;
}
function foot(c, rot){
  var co=Math.abs(Math.cos(rot||0)), si=Math.abs(Math.sin(rot||0));
  return {w: co*c.w + si*c.d, d: si*c.w + co*c.d};
}
function fitsAt(x, z, rot, c){
  var f=foot(c,rot), P=S.pool;
  if(x-f.w/2 < -0.02 || x+f.w/2 > S.deck.w+0.02) return false;
  if(z-f.d/2 < -0.02 || z+f.d/2 > S.deck.h+0.02) return false;
  if(x+f.w/2 > P.x+0.03 && x-f.w/2 < P.x+P.w-0.03 && z+f.d/2 > P.y+0.03 && z-f.d/2 < P.y+P.h-0.03) return false;
  return true;
}
function freeOf(x, z, c, items, skipId){
  var r=Math.max(c.w,c.d)/2, i, o, ro;
  for(i=0;i<items.length;i++){
    o=items[i]; if(o.id===skipId) continue;
    ro=Math.max(byType[o.type].w, byType[o.type].d)/2;
    if(Math.hypot(o.x-x, o.z-z) < (r+ro)*0.8) return false;
  }
  return true;
}
function spotFor(type){
  var c=byType[type], zs=zonesByArea(), i, x, zz, best, bestD, cz;
  for(i=0;i<zs.length;i++){
    cz=zoneCenter(zs[i]); best=null; bestD=1e9;
    for(zz=zs[i].z0+0.25; zz<=zs[i].z1-0.25; zz+=0.25){
      for(x=zs[i].x0+0.25; x<=zs[i].x1-0.25; x+=0.25){
        if(!fitsAt(x,zz,0,c) || !freeOf(x,zz,c,S.items)) continue;
        var dd=Math.hypot(x-cz.x, zz-cz.z);
        if(dd<bestD){ bestD=dd; best={x:Math.round(x*20)/20, z:Math.round(zz*20)/20}; }
      }
    }
    if(best) return best;
  }
  var g=geom(), c2=zoneCenter(g.oeste);
  return {x:c2.x, z:c2.z};
}
/* paso libre a los lados del mueble, dentro de su franja */
function paso(it){
  var c=byType[it.type], f=foot(c, it.rot||0), P=S.pool;
  var z0=it.z-f.d/2, z1=it.z+f.d/2, x0=it.x-f.w/2, x1=it.x+f.w/2, a, b;
  if(x1 > P.x && x0 < P.x+P.w){
    if(z1 <= P.y+0.02){ a = z0; b = P.y - z1; }
    else if(z0 >= P.y+P.h-0.02){ a = z0 - (P.y+P.h); b = S.deck.h - z1; }
    else return null;
  } else { a = z0; b = S.deck.h - z1; }
  return Math.max(a, b);
}
/* fila de muebles; devuelve cuántos cupieron */
function fila(out, type, count, rot, z, xCentro, gap){
  var c=byType[type], i, x, n=0, x0 = xCentro - (count-1)*gap/2;
  for(i=0;i<count;i++){
    x = x0 + i*gap;
    if(fitsAt(x, z, rot, c)){ out.push({type:type, x:x, z:z, rot:rot}); n++; }
  }
  return n;
}
function uno(out, type, x, z, rot){
  if(fitsAt(x, z, rot||0, byType[type])) out.push({type:type, x:x, z:z, rot:rot||0});
}

/* ===================== texturas procedurales ===================== */
function canvasOf(size){ var c = document.createElement("canvas"); c.width=c.height=size; return c; }
function noiseOn(ctx,size,amount){
  var img = ctx.getImageData(0,0,size,size), p = img.data, i, n;
  for(i=0;i<p.length;i+=4){
    n = (Math.random()-0.5)*amount;
    p[i]=Math.max(0,Math.min(255,p[i]+n)); p[i+1]=Math.max(0,Math.min(255,p[i+1]+n)); p[i+2]=Math.max(0,Math.min(255,p[i+2]+n));
  }
  ctx.putImageData(img,0,0);
}
function texFromCanvas(name, c, linear){
  var t = new B.DynamicTexture(name, {width:c.width, height:c.height}, scene, true);
  t.getContext().drawImage(c,0,0);
  t.update(true);
  t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE;
  t.anisotropicFilteringLevel = 8;
  if(linear) t.gammaSpace = false;
  return t;
}
/* normal map a partir de un mapa de altura (Sobel) */
function normalFromCanvas(name, c, strength){
  var s = c.width, ctx = c.getContext("2d"), src = ctx.getImageData(0,0,s,s).data;
  var out = document.createElement("canvas"); out.width=out.height=s;
  var octx = out.getContext("2d"), img = octx.createImageData(s,s), p = img.data;
  function h(x,y){
    x=(x+s)%s; y=(y+s)%s; var i=(y*s+x)*4;
    return (src[i]*0.299+src[i+1]*0.587+src[i+2]*0.114)/255;
  }
  var x,y,dx,dy,len;
  for(y=0;y<s;y++) for(x=0;x<s;x++){
    dx = (h(x-1,y-1)+2*h(x-1,y)+h(x-1,y+1)) - (h(x+1,y-1)+2*h(x+1,y)+h(x+1,y+1));
    dy = (h(x-1,y-1)+2*h(x,y-1)+h(x+1,y-1)) - (h(x-1,y+1)+2*h(x,y+1)+h(x+1,y+1));
    dx *= strength; dy *= strength;
    len = Math.sqrt(dx*dx+dy*dy+1);
    var i=(y*s+x)*4;
    p[i]   = (dx/len*0.5+0.5)*255;
    p[i+1] = (dy/len*0.5+0.5)*255;
    p[i+2] = (1/len*0.5+0.5)*255;
    p[i+3] = 255;
  }
  octx.putImageData(img,0,0);
  return texFromCanvas(name, out, true);
}

function woodCanvas(){
  var S1=1024, c=canvasOf(S1), x=c.getContext("2d");
  /* 1024 px = 2.00 m  ->  tabla de 14.5 cm = 74 px */
  var pitch = 1024*0.145/2.0, i, g, k;
  x.fillStyle="#6f5540"; x.fillRect(0,0,S1,S1);
  for(i=0; i*pitch < S1+pitch; i++){
    var x0 = i*pitch, tone = 96 + Math.random()*22;
    x.fillStyle = "rgb("+Math.round(tone*1.22)+","+Math.round(tone*0.98)+","+Math.round(tone*0.80)+")";
    x.fillRect(x0+1.5, 0, pitch-3, S1);
    for(k=0;k<260;k++){
      x.globalAlpha = 0.05+Math.random()*0.10;
      x.strokeStyle = Math.random()>0.5 ? "#4e3b2b" : "#b79a6d";
      x.lineWidth = 0.7+Math.random()*1.4;
      var gx = x0+2+Math.random()*(pitch-4);
      x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx + (Math.random()-0.5)*6, S1); x.stroke();
    }
    x.globalAlpha = 1;
    /* surco central de la tabla y junta */
    x.fillStyle = "rgba(40,28,18,.35)"; x.fillRect(x0+pitch/2-1, 0, 2, S1);
    x.fillStyle = "rgba(26,18,12,.85)"; x.fillRect(x0-1.5, 0, 3, S1);
  }
  noiseOn(x,S1,10);
  return c;
}
function grassCanvas(){
  var S1=512, c=canvasOf(S1), x=c.getContext("2d"), i, g;
  x.fillStyle="#5d8039"; x.fillRect(0,0,S1,S1);

  }

}
function stoneCanvas(){
  /* 1024 px = 2.00 m : bloques tipo piedra reconstituida de ~40 x 14 cm */
  var S1=1024, c=canvasOf(S1), x=c.getContext("2d");
  var bw = 1024*0.40/2.0, bh = 1024*0.14/2.0, r, bx, t, k;
  x.fillStyle="#9c8c6d"; x.fillRect(0,0,S1,S1);
  for(r=0; r*bh<S1+bh; r++){
    var off = (r%2)*bw*0.5;
    for(bx=-off; bx<S1; bx+=bw){
      t = 198+Math.random()*40;
      x.fillStyle = "rgb("+Math.round(t)+","+Math.round(t*0.93)+","+Math.round(t*0.77)+")";
      x.fillRect(bx+2, r*bh+2, bw-4, bh-4);
      for(k=0;k<40;k++){
        x.fillStyle = "rgba("+Math.round(t*0.78)+","+Math.round(t*0.72)+","+Math.round(t*0.58)+",.5)";
        x.fillRect(bx+3+Math.random()*(bw-8), r*bh+3+Math.random()*(bh-8), 2+Math.random()*10, 1.4);
      }
      x.fillStyle = "rgba(255,255,255,.18)";
      x.fillRect(bx+2, r*bh+2, bw-4, 1.6);
    }
  }
  noiseOn(x,S1,16);
  return c;
}
function tileCanvas(){
  var S1=512, c=canvasOf(S1), x=c.getContext("2d"), n=16, s2=S1/n, i, j, b;
  x.fillStyle="#1d7f9c"; x.fillRect(0,0,S1,S1);
  for(i=0;i<n;i++) for(j=0;j<n;j++){

    x.fillStyle = "rgb("+Math.round(b*0.22)+","+Math.round(b*0.82)+","+Math.round(b*1.02)+")";
    x.fillRect(i*s2+1.2, j*s2+1.2, s2-2.4, s2-2.4);
  }
  return c;
}
function fabricCanvas(hex){
  var S1=256, c=canvasOf(S1), x=c.getContext("2d"), i;
  x.fillStyle=hex; x.fillRect(0,0,S1,S1);
  noiseOn(x,S1,20);
  x.globalAlpha=.10; x.strokeStyle="#000"; x.lineWidth=1;
  for(i=0;i<S1;i+=4){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,S1); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(S1,i); x.stroke(); }
  x.globalAlpha=1;
  return c;
}
function hedgeCanvas(){
  var S1=512, c=canvasOf(S1), x=c.getContext("2d"), i, g;
  x.fillStyle="#24401d"; x.fillRect(0,0,S1,S1);
  for(i=0;i<14000;i++){
    g = 40+Math.random()*95;
    x.fillStyle = "rgba("+Math.round(g*0.5)+","+Math.round(g*1.25)+","+Math.round(g*0.45)+",.9)";
    var px=Math.random()*S1, py=Math.random()*S1, rr=2+Math.random()*6;
    x.beginPath(); x.ellipse(px,py,rr,rr*0.65, Math.random()*3, 0, Math.PI*2); x.fill();
  }
  return c;
}
function rippleCanvas(){
  var S1=512, c=canvasOf(S1), x=c.getContext("2d");
  var img=x.createImageData(S1,S1), p=img.data, i, j, u, v, h;
  for(j=0;j<S1;j++) for(i=0;i<S1;i++){
    u=i/S1*Math.PI*2; v=j/S1*Math.PI*2;
    h = 0.5 + 0.22*Math.sin(u*3+Math.cos(v*2)*1.3) + 0.16*Math.sin(u*7+v*4) + 0.12*Math.cos(v*5-u*2);
    var k=(j*S1+i)*4, val=Math.round(h*255);
    p[k]=p[k+1]=p[k+2]=val; p[k+3]=255;
  }
  x.putImageData(img,0,0);
  return c;
}

/* UV en coordenadas de mundo: la textura mantiene su escala real en todas las piezas */
function worldUV(mesh, tile){
  mesh.computeWorldMatrix(true);
  var pos = mesh.getVerticesData(B.VertexBuffer.PositionKind);
  var nor = mesh.getVerticesData(B.VertexBuffer.NormalKind);
  var uv = new Float32Array(pos.length/3*2);
  var m = mesh.getWorldMatrix(), v = new B.Vector3(), i;
  for(i=0;i<pos.length;i+=3){
    B.Vector3.TransformCoordinatesFromFloatsToRef(pos[i],pos[i+1],pos[i+2], m, v);
    var nx=Math.abs(nor[i]), ny=Math.abs(nor[i+1]), nz=Math.abs(nor[i+2]), u1, v1;
    if(ny >= nx && ny >= nz){ u1 = v.x; v1 = v.z; }
    else if(nx >= nz){ u1 = v.z; v1 = v.y; }
    else { u1 = v.x; v1 = v.y; }
    uv[i/3*2] = u1/tile; uv[i/3*2+1] = v1/tile;
  }
  mesh.setVerticesData(B.VertexBuffer.UVKind, uv, true);
}

function sunDirection(hour){
  var t = (hour-7)/13;
  var elev = Math.max(0.05, Math.sin(Math.PI*t)*1.12);
  var az = Math.PI*0.18 + t*Math.PI*1.05;
  return new B.Vector3(Math.cos(elev)*Math.cos(az), Math.sin(elev), Math.cos(elev)*Math.sin(az));
}
function applySun(){
  var d = sunDirection(S.hour);
  sun.direction = d.scale(-1);
  var low = 1 - Math.min(1, d.y/0.75);
  sun.diffuse = new B.Color3(1, 1-0.16*low, 1-0.38*low);
  sun.intensity = 1.6 + 2.6*Math.min(1, d.y/0.85);
  sky.intensity = 0.28 + 0.42*Math.min(1, d.y/0.85);
  scene.imageProcessingConfiguration.exposure = 0.95 + 0.25*Math.min(1, d.y/0.85);
  if(skyMat){
    skyMat.sunPosition = d.scale(300);
    skyMat.luminance = 0.28 + 0.5*low;
    skyMat.turbidity = 4.5 + 5*low;
  }
  if(probe) probe.cubeTexture.refreshRate = B.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
}

function makeShadows(){

    shadow.filteringQuality = B.ShadowGenerator.QUALITY_MEDIUM;
  }catch(e){
    shadow = new B.ShadowGenerator(2048, sun);
    shadow.useBlurExponentialShadowMap = true; shadow.blurKernel = 32;
  }
  shadow.bias = 0.008; shadow.normalBias = 0.02;
}
function castShadow(m){ if(shadow) { try{ shadow.addShadowCaster(m, true); }catch(e){} } }

/* ===================== mundo ===================== */
var DECK_H = 0.10;                 /* el deck está ~8-10 cm sobre el pasto */
var WALL_H = 1.25;
var POOL_DEPTH = 1.45;
var world = [];                    /* mallas del entorno */
var waterMesh = null, waterMat = null;

function disposeWorld(){
  world.forEach(function(m){ try{ m.dispose(); }catch(e){} });
  world = [];
  if(waterMesh){ try{ waterMesh.dispose(); }catch(e){} waterMesh = null; }
}
function addWorld(m, mat, tile, shadows){
  m.material = mat;
  if(tile > 0) worldUV(m, tile);
  m.receiveShadows = true;
  if(shadows !== false) castShadow(m);
  world.push(m);
  return m;
}
function slab(name, w, h, d, x, y, z, mat, tile){
  var m = B.MeshBuilder.CreateBox(name, {width:w, height:h, depth:d}, scene);
  m.position.set(x, y, z);
  return addWorld(m, mat, tile);
}

function buildWorld(){
  disposeWorld();
  var W = S.deck.w, D = S.deck.h, P = S.pool;
  var px0 = P.x, px1 = P.x+P.w, pz0 = P.y, pz1 = P.y+P.h;

  /* pasto: cuatro paños alrededor del deck, para no tapar el vaso de la piscina */
  var OUT = 26;
  [
    {w:W+OUT*2, d:OUT, x:W/2,        z:D+OUT/2},
    {w:W+OUT*2, d:OUT, x:W/2,        z:-OUT/2},
    {w:OUT,     d:D,   x:-OUT/2,     z:D/2},
    {w:OUT,     d:D,   x:W+OUT/2,    z:D/2}
  ].forEach(function(s2,i){
    var gm = B.MeshBuilder.CreateGround("grass"+i, {width:s2.w, height:s2.d, subdivisions:1}, scene);
    gm.position.set(s2.x, 0, s2.z);
    addWorld(gm, MAT.grass, 1.6, false);
  });

  /* deck: cuatro piezas alrededor de la piscina (sin estirar la textura) */
  var y = DECK_H/2;
  [
    {n:"deckN", w:W,      d:pz0,   x:W/2,        z:pz0/2},
    {n:"deckS", w:W,      d:D-pz1, x:W/2,        z:(pz1+D)/2},
    {n:"deckW", w:px0,    d:P.h,   x:px0/2,      z:(pz0+pz1)/2},
    {n:"deckE", w:W-px1,  d:P.h,   x:(px1+W)/2,  z:(pz0+pz1)/2}
  ].forEach(function(s2){
    if(s2.w <= 0.01 || s2.d <= 0.01) return;
    slab(s2.n, s2.w, DECK_H, s2.d, s2.x, y, s2.z, MAT.wood, 2.0);
    var soil = B.MeshBuilder.CreateBox(s2.n+"soil", {width:s2.w-0.02, height:1.5, depth:s2.d-0.02}, scene);
    soil.position.set(s2.x, -0.75, s2.z);
    addWorld(soil, MAT.soil, 0, false);
  });

  /* vaso de la piscina */
  var bottom = B.MeshBuilder.CreateGround("poolBottom", {width:P.w, height:P.h}, scene);
  bottom.position.set(px0+P.w/2, DECK_H-POOL_DEPTH, pz0+P.h/2);
  addWorld(bottom, MAT.tile, 0.5, false);
  var wallsSpec = [
    {w:P.w, d:0.06, x:px0+P.w/2, z:pz0-0.03},
    {w:P.w, d:0.06, x:px0+P.w/2, z:pz1+0.03},
    {w:0.06, d:P.h, x:px0-0.03,  z:pz0+P.h/2},
    {w:0.06, d:P.h, x:px1+0.03,  z:pz0+P.h/2}
  ];
  wallsSpec.forEach(function(s2,i){
    var m = B.MeshBuilder.CreateBox("poolW"+i, {width:s2.w, height:POOL_DEPTH, depth:s2.d}, scene);
    m.position.set(s2.x, DECK_H-POOL_DEPTH/2, s2.z);
    addWorld(m, MAT.tile, 0.5, false);
  });

  /* muro de piedra y seto */
  var wallLen = W + 10;
  slab("wall", wallLen, WALL_H, 0.30, W/2, WALL_H/2, -0.32, MAT.stone, 2.0);
  slab("wallCap", wallLen+0.12, 0.06, 0.40, W/2, WALL_H+0.03, -0.32, MAT.coping, 2.0);
  var hedge = B.MeshBuilder.CreateBox("hedge", {width:wallLen, height:2.3, depth:0.9}, scene);
  hedge.position.set(W/2, WALL_H+1.15, -0.85);
  addWorld(hedge, MAT.hedge, 1.0);
  var i, n = Math.ceil(wallLen/1.15);
  for(i=0;i<n;i++){
    var b = B.MeshBuilder.CreateSphere("bush"+i, {diameter:1.3+Math.random()*0.7, segments:6}, scene);
    b.position.set(-5 + i*1.15 + Math.random()*0.3, WALL_H+2.3+Math.random()*0.5, -0.9+Math.random()*0.35);
    b.scaling.set(1, 0.85, 0.8);
    addWorld(b, MAT.hedge, 1.0);
  }
  /* setos laterales */
  [{x:-1.5, name:"hedgeW"}, {x:W+1.5, name:"hedgeE"}].forEach(function(s2){
    var hs = B.MeshBuilder.CreateBox(s2.name, {width:0.9, height:2.7, depth:D+7}, scene);
    hs.position.set(s2.x, 1.35, D/2-1.5);
    addWorld(hs, MAT.hedge, 1.0);
    var m2 = Math.ceil((D+7)/1.2), q;
    for(q=0;q<m2;q++){
      var bb = B.MeshBuilder.CreateSphere(s2.name+"b"+q, {diameter:1.2+Math.random()*0.6, segments:6}, scene);
      bb.position.set(s2.x+(Math.random()-0.5)*0.3, 2.7+Math.random()*0.45, D/2-1.5-(D+7)/2 + q*1.2);
      bb.scaling.set(0.85, 0.8, 1);
      addWorld(bb, MAT.hedge, 1.0);
    }
  });

  /* cipreses altos de los costados, como los de la foto */
  function conifer(cx, cz, alt, tag){
    var tr = B.MeshBuilder.CreateCylinder("cf"+tag, {diameterTop:0.16, diameterBottom:0.38, height:alt*0.3, tessellation:8}, scene);
    tr.position.set(cx, alt*0.15, cz); addWorld(tr, MAT.trunk, 0);
    var k, lay = 4;
    for(k=0;k<lay;k++){
      var frac = k/(lay-1);
      var cone = B.MeshBuilder.CreateCylinder("cn"+tag+"_"+k, {
        diameterTop: 0.10 + (1-frac)*0.5,
        diameterBottom: (2.6 - frac*1.7) * (alt/7),
        height: alt*0.34, tessellation:12}, scene);
      cone.position.set(cx, alt*0.26 + frac*alt*0.24 + alt*0.17, cz);
      addWorld(cone, MAT.conifer, 0);
    }
  }
  conifer(W+3.2, -0.6, 8.0, "e1");
  conifer(W+4.6, 3.6, 6.4, "e2");
  conifer(-3.4, 0.4, 6.8, "w1");

  /* árboles del fondo */
  [[-6,-3.4,3.8],[W+5,-3.8,4.2],[W*0.45,-4.6,3.2],[W*0.8,-5.2,3.6],[-4.6,5.5,4.0],[W+4.0,7.5,3.6]].forEach(function(t,k){
    var tr = B.MeshBuilder.CreateCylinder("tr"+k, {diameterTop:0.18, diameterBottom:0.3, height:t[2], tessellation:8}, scene);
    tr.position.set(t[0], t[2]/2, t[1]); addWorld(tr, MAT.trunk, 1.0);
    for(var j=0;j<5;j++){
      var f = B.MeshBuilder.CreateSphere("fol"+k+"_"+j, {diameter:1.8+Math.random()*1.4, segments:6}, scene);
      f.position.set(t[0]+(Math.random()-.5)*1.5, t[2]+0.4+Math.random()*1.6, t[1]+(Math.random()-.5)*1.5);
      addWorld(f, MAT.leaf, 1.0);
    }
  });

  /* agua */
  buildWater();
  buildZones();
  if(probe){ probe.position = new B.Vector3(W/2, 1.2, D/2); }
  refreshRenderLists();
}

function buildWater(){
  var P = S.pool;
  waterMesh = B.MeshBuilder.CreateGround("water", {width:P.w-0.03, height:P.h-0.03, subdivisions:24}, scene);
  waterMesh.position.set(P.x+P.w/2, DECK_H-0.08, P.y+P.h/2);
  if(B.WaterMaterial){
    waterMat = new B.WaterMaterial("water", scene, new B.Vector2(512,512));
    waterMat.bumpTexture = texFromCanvas("ripple", cRipple, true);
    waterMat.windForce = 1.6;
    waterMat.waveHeight = 0.012;
    waterMat.waveLength = 0.22;
    waterMat.bumpHeight = 0.25;
    waterMat.windDirection = new B.Vector2(1, 0.4);
    waterMat.waterColor = new B.Color3(0.05, 0.42, 0.52);
    waterMat.colorBlendFactor = 0.32;
    waterMat.colorBlendFactor2 = 0.55;
    waterMat.alpha = 0.97;
  } else {
    waterMat = new B.PBRMaterial("waterPBR", scene);
    waterMat.albedoColor = B.Color3.FromHexString("#0e6f89");
    waterMat.metallic = 0.1; waterMat.roughness = 0.06;
    waterMat.alpha = 0.86; waterMat.bumpTexture = texFromCanvas("ripple", cRipple, true);
    waterMat.environmentIntensity = 1.4;
  }
  waterMesh.material = waterMat;
}
function refreshRenderLists(){
  if(!waterMat || !waterMat.addToRenderList) return;
  try{
    if(waterMat.reflectionTexture) waterMat.reflectionTexture.renderList = [];
    if(waterMat.refractionTexture) waterMat.refractionTexture.renderList = [];
  }catch(e){}
  try{
    waterMat.addToRenderList(skybox);
    world.forEach(function(m){ if(m !== waterMesh) waterMat.addToRenderList(m); });
    Object.keys(nodes).forEach(function(id){
      nodes[id].meshes.forEach(function(m){ waterMat.addToRenderList(m); });
    });
  }catch(e){}
  if(probe){
    probe.renderList = [];
    probe.renderList.push(skybox);
    world.forEach(function(m){ if(m !== waterMesh) probe.renderList.push(m); });
  }
}

function buildItem(it){

}

var selected = null;
function problem(it){
  var c = byType[it.type], P = S.pool;
  var hw=c.w/2, hd=c.d/2, co=Math.cos(it.rot||0), si=Math.sin(it.rot||0);
  var pts=[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]], onWater=false, offDeck=false, i, qx, qz;
  for(i=0;i<4;i++){
    qx = it.x + pts[i][0]*co - pts[i][1]*si;
    qz = it.z + pts[i][0]*si + pts[i][1]*co;
    if(qx>P.x && qx<P.x+P.w && qz>P.y && qz<P.y+P.h) onWater = true;
    if(qx<-0.02 || qz<-0.02 || qx>S.deck.w+0.02 || qz>S.deck.h+0.02) offDeck = true;
  }
  if(onWater) return "sobre el agua";
  if(offDeck) return "fuera del deck";
  var libre = paso(it);
  if(libre != null && libre < PASO) return "deja " + Math.round(Math.max(0,libre)*100) + " cm de paso";
  return null;
}
function updateRing(){
  var it = selected != null ? itemById(selected) : null;
  if(!it){ ring.setEnabled(false); return; }
  var c = byType[it.type], dia = Math.max(c.w, c.d) + 0.34;
  ring.scaling.set(dia, 1, dia);
  ring.position.set(it.x, DECK_H+0.02, it.z);
  ringMat.emissiveColor = B.Color3.FromHexString(problem(it) ? "#ff9070" : "#57d3c4");
  ring.setEnabled(true);
}
function addItem(type, x, z){
  if(S.items.length >= 60) return null;
  var c = byType[type]; if(!c) return null;
  var spot = (x == null || z == null) ? spotFor(type) : null;
  var it = {id:S.seq++, type:type,
    x: x != null ? x : spot.x,
    z: z != null ? z : spot.z, rot:0};
  S.items.push(it); selected = it.id;
  buildItem(it); refreshRenderLists(); updateRing(); sync(); save();
  return it;
}
function removeSel(){
  if(selected == null) return;
  if(nodes[selected]){ nodes[selected].node.dispose(false,false); delete nodes[selected]; }
  S.items = S.items.filter(function(i){ return i.id !== selected; });
  selected = null; refreshRenderLists(); updateRing(); sync(); save();
}
function applyPreset(p){
  S.items = p.build().filter(function(o){
    return fitsAt(o.x, o.z, o.rot||0, byType[o.type]);
  }).map(function(o){
    return {id:S.seq++, type:o.type, x:Math.round(o.x*20)/20, z:Math.round(o.z*20)/20, rot:o.rot||0};
  });
  selected = null; syncItems(); sync(); save();
}

/* ===================== interacción ===================== */
var dragging = null, dragOff = {x:0,z:0};
var dragPlane = B.Plane.FromPositionAndNormal(new B.Vector3(0,DECK_H,0), new B.Vector3(0,1,0));
function groundPoint(){
  var ray = scene.createPickingRay(scene.pointerX, scene.pointerY, B.Matrix.Identity(), camera);
  var t = ray.intersectsPlane(dragPlane);
  if(t == null) return null;
  var p = ray.origin.add(ray.direction.scale(t));
  return {x:p.x, z:p.z};
}
scene.onPointerObservable.add(function(pi){
  if(pi.type === B.PointerEventTypes.POINTERDOWN){
    var pick = scene.pick(scene.pointerX, scene.pointerY, function(m){ return m.metadata && m.metadata.itemId != null; });
    if(pick && pick.hit && pick.pickedMesh){
      selected = pick.pickedMesh.metadata.itemId;
      var it = itemById(selected), gp = groundPoint();
      dragOff = gp ? {x: it.x-gp.x, z: it.z-gp.z} : {x:0,z:0};
      dragging = selected;
      camera.detachControl(canvas);
      updateRing(); sync();
    } else if(pi.event && pi.event.button === 0){
      var pk = scene.pick(scene.pointerX, scene.pointerY);
      if(!pk || !pk.hit || !pk.pickedMesh || !pk.pickedMesh.metadata){ selected = null; updateRing(); sync(); }
    }
  } else if(pi.type === B.PointerEventTypes.POINTERMOVE){
    if(dragging != null){
      var it2 = itemById(dragging), g = groundPoint();
      if(it2 && g){
        it2.x = Math.round((g.x + dragOff.x)*20)/20;
        it2.z = Math.round((g.z + dragOff.z)*20)/20;
        it2.x = Math.max(-1, Math.min(S.deck.w+1, it2.x));
        it2.z = Math.max(-1, Math.min(S.deck.h+1, it2.z));
        if(nodes[dragging]) nodes[dragging].node.position.set(it2.x, DECK_H, it2.z);
        updateRing(); sync();
      }
    }
  } else if(pi.type === B.PointerEventTypes.POINTERUP){
    if(dragging != null){ dragging = null; camera.attachControl(canvas, true); save(); }
  }
});
window.addEventListener("keydown", function(ev){
  if(ev.target && ev.target.tagName === "INPUT") return;
  var it = selected != null ? itemById(selected) : null;
  if(!it) return;
  var step = ev.shiftKey ? 0.5 : 0.1, used = true;
  switch(ev.key){
    case "ArrowLeft":  it.x -= step; break;
    case "ArrowRight": it.x += step; break;
    case "ArrowUp":    it.z -= step; break;
    case "ArrowDown":  it.z += step; break;
    case "r": case "R": it.rot = (it.rot||0) + (ev.shiftKey ? Math.PI/2 : Math.PI/12); break;
    case "e": case "E": it.rot = (it.rot||0) - Math.PI/12; break;
    case "d": case "D": addItem(it.type, it.x+0.6, it.z+0.6); break;
    case "Delete": case "Backspace": removeSel(); break;
    case "Escape": selected = null; break;
    default: used = false;
  }
  if(used){
    ev.preventDefault();
    if(selected != null && nodes[selected]){
      var i2 = itemById(selected);
      if(i2){ nodes[selected].node.position.set(i2.x, DECK_H, i2.z); nodes[selected].node.rotation.y = i2.rot||0; }
    }
    updateRing(); sync(); save();
  }
});

/* ===================== cámaras predefinidas ===================== */
function viewPhoto(){
  /* posición reconstruida desde la foto: 3,7 m delante del deck, a 1,50 m de altura */
  camera.setTarget(new B.Vector3(S.deck.w*0.385, 1.0, S.deck.h*0.197));
  camera.alpha = 2.076; camera.beta = 1.527; camera.radius = Math.max(9, S.deck.w*0.71);
}
function viewAir(){
  camera.setTarget(new B.Vector3(S.deck.w/2, 0.2, S.deck.h/2));
  camera.alpha = 1.85; camera.beta = 0.62; camera.radius = Math.max(16, S.deck.w*1.2);
}

/* ===================== calidad / post ===================== */
var pipeline = null, ssao = null;
function applyQuality(){
  var high = S.quality === "alta";
  try{
    if(!pipeline){
      pipeline = new B.DefaultRenderingPipeline("post", true, scene, [camera]);
      pipeline.fxaaEnabled = true;
      pipeline.bloomEnabled = true; pipeline.bloomThreshold = 0.85; pipeline.bloomWeight = 0.22; pipeline.bloomKernel = 48;
      pipeline.sharpenEnabled = true; pipeline.sharpen.edgeAmount = 0.22;
    }
    pipeline.samples = high ? 4 : 1;
    pipeline.bloomEnabled = high;
  }catch(e){ pipeline = null; }
  try{
    if(high && !ssao && engine.webGLVersion > 1){
      ssao = new B.SSAO2RenderingPipeline("ssao", scene, {ssaoRatio:0.75, blurRatio:1}, [camera]);
      ssao.radius = 0.5; ssao.totalStrength = 0.9; ssao.base = 0.1; ssao.samples = 16; ssao.expensiveBlur = false;
    } else if(!high && ssao){
      scene.postProcessRenderPipelineManager.detachCamerasFromRenderPipeline("ssao", camera);
      ssao.dispose(); ssao = null;
    }
  }catch(e){ ssao = null; }
  if(shadow){
    try{
      shadow.filteringQuality = high ? B.ShadowGenerator.QUALITY_MEDIUM : B.ShadowGenerator.QUALITY_LOW;
    }catch(e){}
  }
  if(probe) probe.refreshRate = B.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
  engine.setHardwareScalingLevel(high ? 1 : 1.5);
  document.getElementById("qHigh").classList.toggle("on", high);
  document.getElementById("qFast").classList.toggle("on", !high);
  document.getElementById("qNote").textContent = high
    ? "Sombras suaves, oclusión ambiental y reflejos del agua."
    : "Menos efectos, más cuadros por segundo.";
}

/* ===================== interfaz ===================== */
var readout = document.getElementById("readout"), flagEl = document.getElementById("flag");
function sync(){
  var it = selected != null ? itemById(selected) : null;
  if(!it){
    readout.textContent = S.items.length ? S.items.length + " muebles · arrastra el fondo para girar la vista" : "Deck vacío · elige un diseño arriba";
    flagEl.hidden = true;
  } else {
    var c = byType[it.type];
    readout.innerHTML = "<b>"+c.name+"</b> · "+c.w.toFixed(2)+"×"+c.d.toFixed(2)+" m · x "+it.x.toFixed(2)+" / z "+it.z.toFixed(2);
    var p = problem(it);
    flagEl.hidden = !p; flagEl.textContent = p ? "⚠ "+p : "";
  }
}
var catEl = document.getElementById("catalog");
CATALOG.forEach(function(c){
  var b = document.createElement("button");
  b.className = "cat"; b.type = "button";
  b.innerHTML = "<b>"+c.name+"</b><span>"+c.w.toFixed(2)+"×"+c.d.toFixed(2)+"</span>";
  b.addEventListener("click", function(){ addItem(c.type); });
  catEl.appendChild(b);
});
var presetEl = document.getElementById("presets");
PRESETS.forEach(function(p,i){
  var b = document.createElement("button");
  b.className = "chip" + (i===0 ? " on" : ""); b.type = "button"; b.textContent = p.name;
  b.addEventListener("click", function(){
    var kids = presetEl.children, k;
    for(k=0;k<kids.length;k++) kids[k].classList.remove("on");
    b.classList.add("on"); applyPreset(p);
  });
  presetEl.appendChild(b);
});
var dimIds = {deckW:["deck","w"], deckH:["deck","h"], poolW:["pool","w"], poolH:["pool","h"], poolX:["pool","x"], poolY:["pool","y"]};
function fillDims(){ for(var id in dimIds){ var g=dimIds[id][0], k=dimIds[id][1]; document.getElementById(id).value = S[g][k]; } }
var rebuildTimer = null;
Object.keys(dimIds).forEach(function(id){
  document.getElementById(id).addEventListener("input", function(ev){
    var g = dimIds[id][0], k = dimIds[id][1], v = parseFloat(ev.target.value);
    if(isNaN(v) || v <= 0) return;
    S[g][k] = v;
    S.pool.w = Math.min(S.pool.w, S.deck.w); S.pool.h = Math.min(S.pool.h, S.deck.h);
    S.pool.x = Math.max(0, Math.min(S.pool.x, S.deck.w - S.pool.w));
    S.pool.y = Math.max(0, Math.min(S.pool.y, S.deck.h - S.pool.h));
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(function(){ buildWorld(); updateRing(); save(); }, 200);
  });
});
var hourEl = document.getElementById("hour"), hourVal = document.getElementById("hourVal");
function fmtHour(h){ var hh=Math.floor(h), mm=Math.round((h-hh)*60); return (hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm; }
hourEl.addEventListener("input", function(){
  S.hour = parseFloat(hourEl.value); hourVal.textContent = fmtHour(S.hour);
  applySun(); save();
});
document.getElementById("viewPhoto").addEventListener("click", viewPhoto);
document.getElementById("viewAir").addEventListener("click", viewAir);
document.getElementById("btnZonas").addEventListener("click", function(){
  toggleZones(!showZones);
  this.classList.toggle("on", showZones);
  var g = geom();
  readout.textContent = showZones
    ? "Verde: cabe un mueble con paso. Naranjo: franja de " + Math.min(zd(g.sur), zw(g.este)).toFixed(2).replace(".",",") + " m, muy angosta."
    : S.items.length + " muebles en el deck";
});
document.getElementById("btnRef").addEventListener("click", function(){
  var p = document.getElementById("photo");
  p.classList.toggle("show"); this.classList.toggle("on", p.classList.contains("show"));
});
document.getElementById("btnPanel").addEventListener("click", function(){
  var s2 = document.getElementById("side"); s2.hidden = !s2.hidden;
  this.classList.toggle("on", s2.hidden);
});
function rotSel(d){
  var it = selected != null ? itemById(selected) : null; if(!it) return;
  it.rot = (it.rot||0) + d;
  if(nodes[selected]) nodes[selected].node.rotation.y = it.rot;
  save(); sync();
}
document.getElementById("btnRotL").addEventListener("click", function(){ rotSel(-Math.PI/12); });
document.getElementById("btnRotR").addEventListener("click", function(){ rotSel(Math.PI/12); });
document.getElementById("btnDup").addEventListener("click", function(){
  var it = selected != null ? itemById(selected) : null; if(!it) return;
  addItem(it.type, it.x+0.7, it.z+0.7);
});
document.getElementById("btnDel").addEventListener("click", removeSel);
document.getElementById("btnClear").addEventListener("click", function(){
  S.items = []; selected = null; syncItems(); sync(); save();
});
document.getElementById("qHigh").addEventListener("click", function(){ S.quality="alta"; applyQuality(); save(); });
document.getElementById("qFast").addEventListener("click", function(){ S.quality="rapida"; applyQuality(); save(); });

/* ===================== arranque ===================== */
var had = loadSaved();
makeShadows();
makeProbe();
buildWorld();
if(!had || !S.items.length) applyPreset(PRESETS[0]); else syncItems();
fillDims();
hourEl.value = S.hour; hourVal.textContent = fmtHour(S.hour);
applySun();
applyQuality();
viewPhoto();
sync();

scene.executeWhenReady(function(){
  var b = document.getElementById("boot");
  b.hidden = true; b.style.display = "none";
});
engine.runRenderLoop(function(){ scene.render(); });
window.addEventListener("resize", function(){ engine.resize(); });

}catch(err){
  var bb = document.getElementById("boot");
  if(bb){ bb.hidden = false; bb.style.display = "grid"; document.getElementById("bootMsg").textContent = "Error al armar la escena: " + err.message; }
  throw err;
}
}
</script>
</body>
